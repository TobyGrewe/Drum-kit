<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Drum Machine</h1>
        

        <!-- visualizer -->

        <canvas id="visualizer"></canvas>



        <div class="controls">
            <label for="volume">Master Volume</label>
            <input type="range" id="volume" min="0" max="100" value="70">
            <span id="volume-value">70%</span>
            
            
            <!-- ?Dark mode toogle -->
             <button id="theme-toggle">🌒Dark Mode</button>
        </div>
        <div class="drum-pads">
            <div class="pad" data-key="a" data-sound="kick">
                <kbd>A</kbd>
                <span>Kick</span>
            </div>
            <div class="pad" data-key="s" data-sound="snare">
                <kbd>S</kbd>
                <span>Snare</span>
            </div>
            <div class="pad" data-key="d" data-sound="hihat">
                <kbd>D</kbd>
                <span>Hi-Hat</span>
            </div>
            <div class="pad" data-key="f" data-sound="openhat">
                <kbd>F</kbd>
                <span>Open Hat</span>
            </div>
            <div class="pad" data-key="g" data-sound="rimshot">
                <kbd>G</kbd>
                <span>Rimshot</span>
            </div>
            <div class="pad" data-key="h" data-sound="tom">
                <kbd>H</kbd>
                <span>Tom</span>
            </div>
            <div class="pad" data-key="j" data-sound="clap">
                <kbd>J</kbd>
                <span>Clap</span>
            </div>
            <div class="pad" data-key="k" data-sound="crash">
                <kbd>K</kbd>
                <span>Crash</span>
            </div>
            <div class="pad" data-key="l" data-sound="cowbell">
                <kbd>L</kbd>
                <span>Cowbell</span>
            </div>
        </div>
    </div>











    <script src="script.js"></script>
</body>
</html>
