<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Drum Machine</h1>
        <div class="drum-pads">
            <div class="pad" data-key="a" data-sound="kick">
                <kbd>A</kbd>
                <span>Kick</span>
            </div>
            <div class="pad" data-key="s" data-sound="snare">
                <kbd>S</kbd>
                <span>Snare</span>
            </div>
            <div class="pad" data-key="d" data-sound="hihat">
                <kbd>D</kbd>
                <span>Hi-Hat</span>
            </div>
            <div class="pad" data-key="f" data-sound="openhat">
                <kbd>F</kbd>
                <span>Open Hat</span>
            </div>
        </div>
    </div>











    <script src="script.js"></script>
</body>
</html>
